# Sole CI and CD definition (P-13 / P-14). No GitHub Actions.
# PR CI into develop or main: Build (incl. bicep build/lint) + Test. No provision/deploy on PRs.
# Merge to develop -> CD non-prod (rg-coupon-demo). Merge to main -> CD prod (rg-coupon-prod).
# Manual: full eight-stage path; branch selected at queue time picks RG/params (override via parameters).
# Azure auth: workload-identity federated ARM service connection only (AC-9.3).

trigger:
  branches:
    include:
      - develop
      - main

pr:
  branches:
    include:
      - develop
      - main

parameters:
  - name: resourceGroupName
    displayName: Resource group override (auto = derive from branch)
    type: string
    default: auto
  - name: bicepParametersFile
    displayName: Bicep param file override (auto = derive from branch)
    type: string
    default: auto
  - name: azureServiceConnection
    displayName: Workload-identity federated Azure Resource Manager service connection
    type: string
    default: coupon-demo-wif
  - name: location
    displayName: 'Azure region (this subscription: eastus2; westeurope is ineligible)'
    type: string
    default: eastus2

variables:
  - name: DOTNET_NOLOGO
    value: 'true'
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 'true'
  - name: azureServiceConnection
    value: ${{ parameters.azureServiceConnection }}
  - name: location
    value: ${{ parameters.location }}
  # CD on develop/main merges and Manual. PullRequest never sets this path.
  - name: isCD
    value: $[or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Manual'))]
  # Runtime mapping only — compile-time ${{ if }} on Build.SourceBranch breaks trigger YAML parse (informational runs).
  - name: resourceGroupOverride
    value: ${{ parameters.resourceGroupName }}
  - name: bicepParametersOverride
    value: ${{ parameters.bicepParametersFile }}
  - name: resourceGroupName
    value: $[iif(ne(variables['resourceGroupOverride'], 'auto'), variables['resourceGroupOverride'], iif(eq(variables['Build.SourceBranch'], 'refs/heads/main'), 'rg-coupon-prod', 'rg-coupon-demo'))]
  - name: bicepParametersFile
    value: $[iif(ne(variables['bicepParametersOverride'], 'auto'), variables['bicepParametersOverride'], iif(eq(variables['Build.SourceBranch'], 'refs/heads/main'), 'infra/bicep/main.prod.bicepparam', 'infra/bicep/main.dev.bicepparam'))]

stages:
  # --- 1 BUILD ---
  - stage: Build
    displayName: '1 Build'
    jobs:
      - job: Build
        displayName: Restore, build, bicep lint
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Install .NET SDK from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true

          - task: DotNetCoreCLI@2
            displayName: dotnet restore
            inputs:
              command: restore
              projects: CouponService.slnx

          - task: DotNetCoreCLI@2
            displayName: dotnet build (warnings as errors via Directory.Build.props)
            inputs:
              command: build
              projects: CouponService.slnx
              arguments: --no-restore --configuration Release

          - bash: |
              set -euo pipefail
              az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
              az bicep lint --file infra/bicep/main.bicep
            displayName: az bicep build and lint

  # --- 2 TEST ---
  - stage: Test
    displayName: '2 Test'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Test
        displayName: Unit, engine, API, BDD (in-process)
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Install .NET SDK from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true

          - task: DotNetCoreCLI@2
            displayName: dotnet test
            inputs:
              command: test
              projects: CouponService.slnx
              arguments: --configuration Release
              publishTestResults: true

  # --- 3 PACKAGE (CD only) ---
  - stage: Package
    displayName: '3 Package'
    dependsOn: Test
    # AC-9.4 — Test must succeed before anything packaged or deployed; PRs never reach here.
    condition: and(succeeded(), eq(variables['isCD'], 'true'))
    jobs:
      - job: Package
        displayName: Publish API outputs and OpenAPI
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Install .NET SDK from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true

          - task: DotNetCoreCLI@2
            displayName: Publish CouponService.Api
            inputs:
              command: publish
              publishWebProjects: false
              projects: src/CouponService.Api/CouponService.Api.csproj
              arguments: --configuration Release --output $(Build.ArtifactStagingDirectory)/coupon-api
              zipAfterPublish: false

          - task: DotNetCoreCLI@2
            displayName: Publish OrderApi
            inputs:
              command: publish
              publishWebProjects: false
              projects: src/OrderApi/OrderApi.csproj
              arguments: --configuration Release --output $(Build.ArtifactStagingDirectory)/order-api
              zipAfterPublish: false

          - task: PublishPipelineArtifact@1
            displayName: Publish coupon-api artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/coupon-api
              artifact: coupon-api

          - task: PublishPipelineArtifact@1
            displayName: Publish order-api artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/order-api
              artifact: order-api

          - task: PublishPipelineArtifact@1
            displayName: Publish OpenAPI snapshots when present
            inputs:
              targetPath: docs/api/generated
              artifact: openapi
            condition: succeeded()

  # --- 4 PROVISION (CD only) ---
  - stage: Provision
    displayName: '4 Provision'
    dependsOn:
      - Test
      - Package
    # Depends on Test as well so a Test failure can never reach create (AC-9.4).
    condition: and(succeeded(), eq(variables['isCD'], 'true'))
    jobs:
      - job: Provision
        displayName: Bicep what-if then create
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: az deployment group what-if
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                mkdir -p "$(Build.ArtifactStagingDirectory)/what-if"
                az deployment group what-if \
                  --resource-group "$(resourceGroupName)" \
                  --template-file infra/bicep/main.bicep \
                  --parameters "$(bicepParametersFile)" \
                  > "$(Build.ArtifactStagingDirectory)/what-if/what-if.txt"

          # AC-9.2 — what-if must be published as an artifact before create applies changes.
          - task: PublishPipelineArtifact@1
            displayName: Publish what-if result before apply
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/what-if
              artifact: bicep-what-if

          - task: AzureCLI@2
            displayName: az deployment group create
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                mkdir -p "$(Build.ArtifactStagingDirectory)/provision-outputs"
                az deployment group create \
                  --resource-group "$(resourceGroupName)" \
                  --template-file infra/bicep/main.bicep \
                  --parameters "$(bicepParametersFile)" \
                  --query properties.outputs \
                  -o json > "$(Build.ArtifactStagingDirectory)/provision-outputs/outputs.json"

          - task: PublishPipelineArtifact@1
            displayName: Publish provision outputs
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/provision-outputs
              artifact: provision-outputs

  # --- 5 DEPLOY (CD only) ---
  - stage: Deploy
    displayName: '5 Deploy'
    dependsOn: Provision
    condition: and(succeeded(), eq(variables['isCD'], 'true'))
    jobs:
      - job: Deploy
        displayName: Build images, update apps, wait for readiness
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - download: current
            artifact: provision-outputs

          - task: AzureCLI@2
            displayName: Build and push images to ACR then update Container Apps
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                OUTPUTS="$(Pipeline.Workspace)/provision-outputs/outputs.json"
                HOSTING=$(jq -r '.hostingMode.value // "containerApps"' "$OUTPUTS")
                ACR_NAME=$(jq -r '.acrName.value // empty' "$OUTPUTS")
                ACR_SERVER=$(jq -r '.acrLoginServer.value // empty' "$OUTPUTS")
                COUPON_APP=$(jq -r '.couponAppName.value // empty' "$OUTPUTS")
                ORDER_APP=$(jq -r '.orderAppName.value // empty' "$OUTPUTS")
                COUPON_URL=$(jq -r '.couponBackendUrl.value // empty' "$OUTPUTS")
                ORDER_URL=$(jq -r '.orderBackendUrl.value // empty' "$OUTPUTS")
                APIM_URL=$(jq -r '.apimGatewayUrl.value // empty' "$OUTPUTS")
                if [ -z "$COUPON_URL" ]; then
                  echo "couponBackendUrl missing from provision outputs; cannot deploy."
                  exit 1
                fi
                echo "##vso[task.setvariable variable=couponBackendUrl]$COUPON_URL"
                echo "##vso[task.setvariable variable=orderBackendUrl]$ORDER_URL"
                echo "##vso[task.setvariable variable=apimGatewayUrl]$APIM_URL"

                if [ "$HOSTING" != "containerApps" ]; then
                  echo "hostingMode=$HOSTING; image push is Container Apps only in this pipeline."
                  exit 0
                fi
                if [ -z "$ACR_NAME" ] || [ -z "$ACR_SERVER" ] || [ -z "$COUPON_APP" ] || [ -z "$ORDER_APP" ]; then
                  echo "ACR or Container App names missing from provision outputs."
                  exit 1
                fi

                TAG="$(Build.BuildId)"
                az acr login --name "$ACR_NAME"
                docker build \
                  --file src/CouponService.Api/Dockerfile \
                  --tag "${ACR_SERVER}/coupon-api:${TAG}" \
                  .
                docker build \
                  --file src/OrderApi/Dockerfile \
                  --tag "${ACR_SERVER}/order-api:${TAG}" \
                  .
                docker push "${ACR_SERVER}/coupon-api:${TAG}"
                docker push "${ACR_SERVER}/order-api:${TAG}"

                az containerapp update \
                  --name "$COUPON_APP" \
                  --resource-group "$(resourceGroupName)" \
                  --image "${ACR_SERVER}/coupon-api:${TAG}"
                az containerapp update \
                  --name "$ORDER_APP" \
                  --resource-group "$(resourceGroupName)" \
                  --image "${ACR_SERVER}/order-api:${TAG}"

          - bash: |
              set -euo pipefail
              # Readiness probe must pass before Seed (section 18).
              for i in $(seq 1 36); do
                if curl -fsS "${COUPON_BACKEND_URL}/v1/health/ready"; then
                  echo "Coupon API ready."
                  exit 0
                fi
                sleep 10
              done
              echo "Coupon API readiness probe failed."
              exit 1
            displayName: Wait for coupon API readiness
            env:
              COUPON_BACKEND_URL: $(couponBackendUrl)

  # --- 6 SEED (CD only) ---
  - stage: Seed
    displayName: '6 Seed'
    dependsOn: Deploy
    condition: and(succeeded(), eq(variables['isCD'], 'true'))
    jobs:
      - job: Seed
        displayName: Idempotent deterministic policy seed
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - download: current
            artifact: provision-outputs

          - pwsh: |
              $ErrorActionPreference = 'Stop'

              function Get-ConfiguredValue {
                param([string] $Value)
                if ([string]::IsNullOrWhiteSpace($Value)) { return $null }
                if ($Value -match '^\$\([A-Za-z0-9_]+\)$') { return $null }
                return $Value.Trim()
              }

              $outputsPath = Join-Path $env:PIPELINE_WORKSPACE 'provision-outputs/outputs.json'
              $outputs = Get-Content -LiteralPath $outputsPath -Raw | ConvertFrom-Json

              $base = Get-ConfiguredValue -Value $env:ADMIN_API_BASE_URL
              if ($null -eq $base) {
                $base = Get-ConfiguredValue -Value ([string]$outputs.couponBackendUrl.value)
              }

              if ($null -eq $base) {
                throw 'Coupon Service base URL could not be resolved from AdminApiBaseUrl or couponBackendUrl.'
              }

              $uri = $null
              if (-not [Uri]::TryCreate($base, [UriKind]::Absolute, [ref]$uri) -or
                  ($uri.Scheme -ne [Uri]::UriSchemeHttp -and $uri.Scheme -ne [Uri]::UriSchemeHttps)) {
                throw "Coupon Service base URL is not an absolute http(s) URI: '$base'"
              }

              # The service seeds itself as it starts, so this stage verifies rather than writes.
              # The readiness probe is anonymous, which keeps CD free of an admin credential.
              $readyUrl = "$($base.TrimEnd('/'))/v1/health/ready"
              Write-Host "Verifying deterministic policy seed via $readyUrl"

              $expected = (Get-Content -LiteralPath (Join-Path $env:BUILD_SOURCESDIRECTORY 'src/CouponService.Api/Seeding/SeedPolicies.json') -Raw |
                ConvertFrom-Json).Count
              Write-Host "Expecting $expected seeded policies."

              for ($attempt = 1; $attempt -le 30; $attempt++) {
                $status = 0
                $body = Invoke-RestMethod -Uri $readyUrl -Method Get -SkipHttpErrorCheck -StatusCodeVariable status
                if ([int]$status -eq 200) {
                  Write-Host "Seed verified: readiness reports healthy after $attempt attempt(s)."
                  exit 0
                }

                Write-Host "Attempt $attempt : HTTP $status $($body | ConvertTo-Json -Compress -Depth 5)"
                Start-Sleep -Seconds 10
              }

              throw "Readiness never reported a healthy policy seed. Check the policy-seed health check and the Seeding__Enabled setting on the Coupon Service."
            displayName: Verify deterministic policy seed (AC-9.5, AC-9.6)
            env:
              PIPELINE_WORKSPACE: $(Pipeline.Workspace)
              BUILD_SOURCESDIRECTORY: $(Build.SourcesDirectory)
              ADMIN_API_BASE_URL: $(AdminApiBaseUrl)
  # --- 7 SMOKE (CD only) ---
  # The Reqnroll scenarios run in process in the Test stage, where the clock and the policy
  # store are controllable. A deployed service offers neither, so this stage verifies the
  # deployment instead of re-running behaviour. See .kiro/specs/deployed-stack-smoke/bugfix.md.
  - stage: Smoke
    displayName: '7 Smoke'
    dependsOn: Seed
    condition: and(succeeded(), eq(variables['isCD'], 'true'))
    jobs:
      - job: Smoke
        displayName: Smoke the deployed stack through APIM
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - download: current
            artifact: provision-outputs

          # AzureCLI@2 rather than pwsh, because the smoke needs a real Entra token and only
          # the service connection can mint one. Resolution and invocation stay in one step so
          # no URL is handed between steps through a variable that can expand empty.
          - task: AzureCLI@2
            displayName: Smoke health, gateway auth and a seeded policy
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                function Get-ConfiguredValue {
                  param([string] $Value)
                  if ([string]::IsNullOrWhiteSpace($Value)) { return $null }
                  if ($Value -match '^\$\([A-Za-z0-9_]+\)$') { return $null }
                  return $Value.Trim()
                }

                $outputsPath = Join-Path $env:PIPELINE_WORKSPACE 'provision-outputs/outputs.json'
                $outputs = Get-Content -LiteralPath $outputsPath -Raw | ConvertFrom-Json

                $coupon = Get-ConfiguredValue -Value $env:SMOKE_COUPON_BASE_URL
                $order = Get-ConfiguredValue -Value $env:SMOKE_ORDER_BASE_URL

                if ($null -eq $coupon -or $null -eq $order) {
                  $apim = Get-ConfiguredValue -Value ([string]$outputs.apimGatewayUrl.value)
                  if ($null -eq $apim) {
                    throw 'apimGatewayUrl is absent from the provision outputs, so there is no gateway to smoke. Set SmokeCouponBaseUrl and SmokeOrderBaseUrl to smoke a different target.'
                  }

                  $gateway = $apim.TrimEnd('/')
                  if ($null -eq $coupon) { $coupon = $gateway + '/coupons' }
                  if ($null -eq $order) { $order = $gateway + '/orders' }
                }

                $audience = Get-ConfiguredValue -Value $env:COUPON_API_AUDIENCE
                if ($null -eq $audience) {
                  $audience = Get-ConfiguredValue -Value ([string]$outputs.couponApiAudience.value)
                }
                if ($null -eq $audience) {
                  throw 'couponApiAudience could not be resolved from CouponApiAudience or the provision outputs.'
                }

                $scriptPath = Join-Path $env:BUILD_SOURCESDIRECTORY 'scripts/smoke-deployed-stack.ps1'
                & $scriptPath -CouponBaseUrl $coupon -OrderBaseUrl $order -Audience $audience
            env:
              PIPELINE_WORKSPACE: $(Pipeline.Workspace)
              BUILD_SOURCESDIRECTORY: $(Build.SourcesDirectory)
              SMOKE_COUPON_BASE_URL: $(SmokeCouponBaseUrl)
              SMOKE_ORDER_BASE_URL: $(SmokeOrderBaseUrl)
              COUPON_API_AUDIENCE: $(CouponApiAudience)

  # --- 8 VERIFY (CD only) ---
  - stage: Verify
    displayName: '8 Verify'
    dependsOn: Smoke
    condition: and(succeeded(), eq(variables['isCD'], 'true'))
    jobs:
      - job: Verify
        displayName: Smoke and result summary
        pool:
          vmImage: ubuntu-latest
        steps:
          - download: current
            artifact: provision-outputs

          # Same empty-variable trap as Seed/Smoke: when AdminApiBaseUrl is unset, ADO expands
          # $(AdminApiBaseUrl) to the literal string, which is non-empty for bash and becomes a
          # "Bad hostname" for curl. Resolve and validate in one pwsh step against the backend.
          - pwsh: |
              $ErrorActionPreference = 'Stop'

              function Get-ConfiguredValue {
                param([string] $Value)
                if ([string]::IsNullOrWhiteSpace($Value)) { return $null }
                if ($Value -match '^\$\([A-Za-z0-9_]+\)$') { return $null }
                return $Value.Trim()
              }

              $outputsPath = Join-Path $env:PIPELINE_WORKSPACE 'provision-outputs/outputs.json'
              $outputs = Get-Content -LiteralPath $outputsPath -Raw | ConvertFrom-Json

              $base = Get-ConfiguredValue -Value $env:ADMIN_API_BASE_URL
              if ($null -eq $base) {
                $base = Get-ConfiguredValue -Value ([string]$outputs.couponBackendUrl.value)
              }

              if ($null -eq $base) {
                throw 'Coupon Service base URL could not be resolved from AdminApiBaseUrl or couponBackendUrl.'
              }

              $uri = $null
              if (-not [Uri]::TryCreate($base, [UriKind]::Absolute, [ref]$uri) -or
                  ($uri.Scheme -ne [Uri]::UriSchemeHttp -and $uri.Scheme -ne [Uri]::UriSchemeHttps)) {
                throw "Coupon Service base URL is not an absolute http(s) URI: '$base'"
              }

              $base = $base.TrimEnd('/')
              Write-Host "Verify against backend $base"

              foreach ($path in @('/v1/health/live', '/v1/health/ready')) {
                $status = 0
                $null = Invoke-RestMethod -Uri "$base$path" -Method Get -SkipHttpErrorCheck -StatusCodeVariable status
                if ([int]$status -ne 200) {
                  throw "Backend $path returned HTTP $status."
                }
                Write-Host "  PASS  $path (HTTP 200)"
              }

              Write-Host 'Smoke checks passed. Optional teardown is not performed (demo environment retained).'
            displayName: Smoke health endpoints
            env:
              PIPELINE_WORKSPACE: $(Pipeline.Workspace)
              ADMIN_API_BASE_URL: $(AdminApiBaseUrl)
